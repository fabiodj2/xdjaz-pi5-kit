# Host Xorg for the AZ player on the 7" panel: modesetting on the vc4 KMS node.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "vc4"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "glamor"	# GPU (V3D) rendering
    Option "Monitor-HDMI-1" "panel"
    Option "Monitor-HDMI-2" "panel"
EndSection
# Start straight in the mode the player is timed for (59.24 Hz, see
# run-probe.sh setmode: the panel's native timings, line stretched to 1357), so
# no mode change blanks the panel once the player is up.
Section "Monitor"
    Identifier "panel"
    Modeline "1024x600_59.24" 50.25 1024 1068 1156 1357 600 603 609 625 +hsync -vsync
    Option "PreferredMode" "1024x600_59.24"
EndSection
# The picture is the right way up, but the touchscreen reports 180 degrees off.
Section "InputClass"
    Identifier "touchscreen 180"
    MatchIsTouchscreen "on"
    Option "CalibrationMatrix" "-1 0 1 0 -1 1 0 0 1"
EndSection
