# Host Xorg for the AZ player on the 7" panel: modesetting on the vc4 KMS node.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "vc4"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "glamor"	# GPU (V3D) rendering
    Option "Monitor-HDMI-1" "panel"
    Option "Monitor-HDMI-2" "panel"
EndSection
Section "Monitor"
    Identifier "panel"
EndSection
